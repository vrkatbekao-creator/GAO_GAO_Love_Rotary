<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《高高平等：人人有輪坐》 — 市政諷刺模擬</title>
  <link rel="stylesheet" href="css/desk.css">
</head>
<body>
  <div id="office-desk-container">
    
    <!-- 頂部有線電視新聞快訊欄 -->
    <header id="cable-news-banner">
      <div class="news-badge">⚡ 獨家快訊</div>
      <div class="news-ticker-wrap">
        <div id="news-ticker-text" class="news-ticker-content news-ticker-sliding">
          【快訊】舊城區天空消失第三天，居民自發舉辦「尋找太陽」燭光晚會。
        </div>
      </div>
      
      <!-- 市長 5 大幹話發言盒 -->
      <div class="mayor-quote-box">
        <div class="mayor-avatar" id="mayor-avatar-btn" title="市長 韓國瑜 Q 版 (點擊切換下則發言)">
          <svg viewBox="0 0 64 64" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="30" fill="#fff9db" stroke="#ffd43b" stroke-width="2"/>
            <!-- 招牌藍色襯衫身軀 (經典捲袖淺藍襯衫) -->
            <path d="M 14 58 C 14 45 22 41 32 41 C 42 41 50 45 50 58 Z" fill="#339af0"/>
            <!-- 襯衫白色領口與V領開襟 -->
            <path d="M 26 41 L 32 49 L 38 41 Z" fill="#ffffff"/>
            <path d="M 32 45 L 32 54" stroke="#1c7ed6" stroke-width="1.5" stroke-linecap="round"/>
            <!-- 小胸章 -->
            <circle cx="23" cy="48" r="2.5" fill="#51cf66"/>

            <!-- 光頭頭部本體 (圓潤親切粉膚色) -->
            <ellipse cx="32" cy="27" rx="17" ry="18" fill="#ffe3c2"/>
            
            <!-- 招牌額頭反光光斑 (標誌性大光頭高光) -->
            <ellipse cx="26" cy="16" rx="6" ry="2.5" transform="rotate(-20 26 16)" fill="#ffffff" opacity="0.8"/>
            <circle cx="34" cy="14" r="1.5" fill="#ffffff" opacity="0.6"/>

            <!-- 招牌頂部與兩側幾根標誌性稀疏毛髮 -->
            <path d="M 30 9 Q 32 6 34 8" stroke="#495057" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 33 8 Q 36 5 37 8" stroke="#495057" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M 15 25 Q 13 23 15 20" stroke="#495057" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M 49 25 Q 51 23 49 20" stroke="#495057" stroke-width="1.2" stroke-linecap="round"/>

            <!-- 耳朵 -->
            <ellipse cx="14" cy="28" rx="2.5" ry="4" fill="#ffd8a8"/>
            <ellipse cx="50" cy="28" rx="2.5" ry="4" fill="#ffd8a8"/>

            <!-- 招牌親切八字笑眉 -->
            <path d="M 21 21 Q 25 19 28 22" stroke="#495057" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M 36 22 Q 39 19 43 21" stroke="#495057" stroke-width="1.8" stroke-linecap="round"/>

            <!-- 標誌性瞇瞇眼招牌笑眼 (開朗月牙彎彎眼) -->
            <path d="M 22 27 Q 26 23 29 27" stroke="#212529" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 35 27 Q 38 23 42 27" stroke="#212529" stroke-width="2.2" stroke-linecap="round"/>
            <!-- 眼角招牌笑紋 (魚尾紋) -->
            <path d="M 19 26 L 21 27" stroke="#868e96" stroke-width="1" stroke-linecap="round"/>
            <path d="M 45 26 L 43 27" stroke="#868e96" stroke-width="1" stroke-linecap="round"/>

            <!-- 圓圓小鼻子 -->
            <path d="M 31 30 Q 32 32 33 30" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/>

            <!-- 招牌開懷大笑嘴巴 (露出上排白牙與舌頭) -->
            <path d="M 25 33 Q 32 41 39 33 Z" fill="#c92a2a"/>
            <!-- 白牙 -->
            <path d="M 26 33.5 Q 32 36 38 33.5 Z" fill="#ffffff"/>
            <!-- 舌頭 -->
            <path d="M 29 38 Q 32 36 35 38 Z" fill="#ff8787"/>

            <!-- 招牌紅潤微笑腮紅 -->
            <circle cx="19" cy="31" r="3" fill="#ff6b6b" opacity="0.45"/>
            <circle cx="45" cy="31" r="3" fill="#ff6b6b" opacity="0.45"/>
          </svg>
        </div>
        <div id="mayor-quote-text" class="mayor-text">
          愛情不是感覺，愛情是本市下個季度的 GDP！
        </div>
      </div>

      <!-- 手語翻譯員 AI 模組 -->
      <div class="interpreter-box">
        <div id="interpreter-face" class="interpreter-face">😊</div>
        <div class="interpreter-label">
          <span id="label-interpreter-title" class="interpreter-title">手語翻譯</span>
          <span id="interpreter-mood">專業微笑</span>
        </div>
      </div>
    </header>

    <!-- 主工作區 (3D 微縮沙盤 + 2D 桌面物件) -->
    <main id="main-viewport-layout">
      
      <!-- 3D 沙盤畫布容器 -->
      <div id="diorama-3d-wrapper">
        <canvas id="diorama-canvas"></canvas>
        <div id="webgl-fallback-note" role="status" hidden></div>
      </div>

      <!-- 螢幕周遭便利貼遮擋層 (左側保留給行政負擔展現) -->
      <div id="sticky-notes-zone"></div>

      <!-- 財政局長崩潰進程道具 (受預算赤字驅動) -->
      <div id="director-meltdown-props"></div>

      <!-- 右側整合選擇面板抽屜 (Unified Right-Side Drawer: Actions & Settings) -->
      <nav id="action-drawer" class="action-drawer">
        <!-- 抽屜常駐開關握把 1：建設行動 (Action Drawer Pull Tab) -->
        <button id="drawer-toggle-btn" class="drawer-toggle-tab tab-actions" type="button" aria-expanded="false" title="開啟/收起建設行動選單 (快捷鍵 B)">
          <span class="drawer-tab-icon">🏗️</span>
          <span id="drawer-tab-text" class="drawer-tab-text">建設行動</span>
          <span id="drawer-tab-arrow" class="drawer-tab-arrow">◀</span>
        </button>

        <!-- 抽屜常駐開關握把 2：市政決策與設定 (Settings Drawer Pull Tab) -->
        <button id="drawer-settings-toggle-btn" class="drawer-toggle-tab tab-settings" type="button" aria-expanded="false" title="開啟/收起市政決策與語言設定 (快捷鍵 S)">
          <span class="drawer-tab-icon">⚙️</span>
          <span id="settings-tab-text" class="drawer-tab-text">市政決策</span>
          <span id="settings-tab-arrow" class="drawer-tab-arrow">◀</span>
        </button>

        <!-- 抽屜內部本體 -->
        <div class="drawer-inner">
          <div class="drawer-header">
            <!-- 內部頁籤切換器 (Drawer Top Switcher) -->
            <div class="drawer-tab-switch-group">
              <button id="tab-btn-actions" class="drawer-nav-tab active" type="button">
                <span>🏗️ 建設行動</span>
              </button>
              <button id="tab-btn-settings" class="drawer-nav-tab" type="button">
                <span>⚙️ 市政決策</span>
              </button>
            </div>
            <button id="drawer-close-btn" class="drawer-close-btn" type="button" aria-label="Close Drawer">✕</button>
          </div>

          <!-- 面板 1：市政建設行動清單 -->
          <div id="panel-actions" class="drawer-tab-panel active">
            <div class="action-btn-scroll-list">
              <button class="action-btn" data-action="wheel">
                <span>🎡 愛情摩天輪</span>
                <span class="cost-badge">$8億 / 2回</span>
              </button>
              <button class="action-btn" data-action="shuttle">
                <span>🚌 愛情接駁線</span>
                <span class="cost-badge">$3億 / 即時</span>
              </button>
              <button class="action-btn" data-action="market">
                <span>🏪 愛情商圈</span>
                <span class="cost-badge">$3億 / 1回</span>
              </button>
              <button class="action-btn" data-action="event">
                <span>💕 巡迴充氣活動</span>
                <span class="cost-badge">$2億 / 即時</span>
              </button>
              <button class="action-btn" data-action="hearing">
                <span>📋 召開公聽會</span>
                <span class="cost-badge">$1億 / 催眠</span>
              </button>
              <button class="action-btn" data-action="repay">
                <span>💰 償還債務</span>
                <span class="cost-badge">上限現金</span>
              </button>
              <button class="action-btn" data-action="rest" style="background:#e9ecef;">
                <span>☕ 暫停建設 (休息)</span>
                <span class="cost-badge">$0</span>
              </button>
            </div>
          </div>

          <!-- 面板 2：市政決策與系統設定 -->
          <div id="panel-settings" class="drawer-tab-panel">
            <div class="settings-drawer-content">
              <!-- 區塊 1：多語言切換 (i18n Language) -->
              <div class="settings-group">
                <label class="settings-group-label" for="lang-select">
                  <span class="settings-group-icon">🌐</span>
                  <span id="label-drawer-lang">語言選擇 (Language)</span>
                </label>
                <select id="lang-select" class="settings-select-dropdown">
                  <option value="zh">繁體中文</option>
                  <option value="en">English</option>
                  <option value="ja">日本語</option>
                  <option value="fr">Français</option>
                  <option value="nl">Nederlands</option>
                </select>
              </div>

              <!-- 區塊 2：財政開局與決策 (Fiscal Start & Decision) -->
              <div class="settings-group">
                <label class="settings-group-label" for="budget-scenario-select">
                  <span class="settings-group-icon">💰</span>
                  <span id="label-drawer-budget">起始預算決策 (Fiscal Policy)</span>
                </label>
                <select id="budget-scenario-select" class="settings-select-dropdown" title="選擇起始預算模式 (零基或負基)">
                  <option value="0.5">🟢 零基預算 (+$0.5億)</option>
                  <option value="-6.0">🟡 輕度負基 (-$6.0億)</option>
                  <option value="-12.0">🟠 重度負基 (-$12.0億)</option>
                  <option value="-18.0">🔴 極限負基 (-$18.0億)</option>
                  <option value="custom">⚙️ 自訂數值 (+0.5 ~ -18.0億)...</option>
                </select>
                <div id="settings-budget-hint" class="settings-hint-text">
                  ※ 零基開局 (+0.5億) 考驗精準撙節；負基開局 (-18.0億) 將面臨利息與查封深淵。
                </div>
              </div>

              <!-- 區塊 3：快速操作 (Quick Actions) -->
              <div class="settings-group settings-group-actions">
                <button id="btn-restart-game" class="settings-action-btn" type="button">
                  <span id="label-btn-restart">🔄 重新召開市政會議</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <!-- 行政區/端點選取彈窗 (Zone Selector Modal) -->
      <div id="zone-picker-modal" role="dialog" aria-labelledby="zone-modal-title">
        <div id="zone-modal-title" class="zone-picker-title">選擇目標行政區</div>
        <div id="zone-options-grid" class="zone-options-grid" role="region" aria-labelledby="zone-modal-title" tabindex="0"></div>
        <button id="zone-modal-cancel" class="modal-cancel-btn" type="button">取消本項行動</button>
      </div>

      <!-- 成就解鎖提示浮窗容器 -->
      <div id="achievement-toast-container"></div>
    </main>

    <!-- 沙盤底座實體化儀表板 -->
    <footer id="diorama-base-dashboard">
      <!-- 7 段 LED 預算顯示器 -->
      <div class="led-panel">
        <span class="led-title">NET BUDGET 淨預算餘額</span>
        <span id="led-budget-val" class="led-value">$0.5 億</span>
      </div>

      <!-- 核心三項市政指標進度條組 -->
      <div class="stats-strip">
        <div class="stat-item">
          <div class="stat-label-wrap">
            <span>觀光活力</span>
            <span id="val-tourism">20</span>
          </div>
          <div class="stat-bar-bg">
            <div id="bar-tourism-fill" class="stat-bar-fill bar-tourism" style="width: 20%;"></div>
          </div>
        </div>

        <div class="stat-item">
          <div class="stat-label-wrap">
            <span>行政負擔</span>
            <span id="val-admin">20</span>
          </div>
          <div class="stat-bar-bg">
            <div id="bar-admin-fill" class="stat-bar-fill bar-admin" style="width: 20%;"></div>
          </div>
        </div>

        <div class="stat-item">
          <div class="stat-label-wrap">
            <span>陳情壓力</span>
            <span id="val-complaints">20</span>
          </div>
          <div class="stat-bar-bg">
            <div id="bar-complaints-fill" class="stat-bar-fill bar-complaints" style="width: 20%;"></div>
          </div>
        </div>
      </div>

      <!-- 章節與回合進度紀念金屬牌 -->
      <div class="turn-plaque">
        <div id="chapter-text" class="turn-chapter">第 1 章</div>
        <div id="turn-text" class="turn-number">第 1 / 12 回合</div>
      </div>
    </footer>

    <!-- 公文蓋章決行覆蓋層 (Document Overlay Modal) -->
    <div id="document-overlay-modal">
      <div id="official-document">
        <div class="doc-header">
          <div>
            <div class="doc-gov-title">高雄市市政重大決策簽呈</div>
            <div id="doc-chapter-label" style="font-size:12px;color:#7d5a36;font-weight:bold;">第 1 章決行</div>
          </div>
          <div id="doc-id" class="doc-id-stamp">EV01</div>
        </div>
        
        <div id="doc-title" class="doc-subject">主旨：市長要求超大型願景背板</div>
        <div class="doc-disclaimer">※ 備註：以下各項方案均屬虛構市政決策，後續影響將由主政首長承擔全責。</div>

        <div id="doc-choices" class="doc-choices-wrap"></div>
      </div>
    </div>

  </div>

  <!-- 引入遊戲主程式與 3D 沙盤、音效與結算模組 -->
  <script type="module">
    import { GameManager } from './js/game_manager.js';
    import { DeskUI } from './js/desk_ui.js';
    import { Diorama3D } from './js/diorama_3d.js';
    import { AudioEngine } from './js/audio_engine.js';
    import { DossierEnding } from './js/dossier_ending.js';
    import { t } from './js/i18n.js';

    // 初始化音效引擎
    window.audio = new AudioEngine();
    let audioStarted = false;
    document.addEventListener('click', () => {
      if (!audioStarted) {
        audioStarted = true;
        window.audio.startBossaNovaBGM();
      }
    }, { once: true });

    // 初始化 3D 沙盤實例 (具備容錯降級機制)
    try {
      window.diorama = new Diorama3D('diorama-canvas');
    } catch (e) {
      console.warn('3D Diorama init failed, using fallback:', e);
      window.diorama = {
        canvas: document.getElementById('diorama-canvas'),
        webglSupported: false,
        spawnWheel: () => {},
        buildShuttle: () => {},
        buildMarket: () => {},
        spawnInflatableCupid: () => {},
        triggerVfx: () => {},
        applyCourtSeizure: () => {},
        reset: () => {}
      };
    }

    if (!window.diorama.webglSupported || !window.diorama.renderer) {
      const fallbackNote = document.getElementById('webgl-fallback-note');
      fallbackNote.hidden = false;
      fallbackNote.textContent = t('webgl_unavailable');
    }

    // 初始化結算卷宗模組
    window.dossier = new DossierEnding('office-desk-container');

    // 初始化核心遊戲實例 (預設 0.5 億零基預算開局)
    window.game = new GameManager(42, 0.5);
    window.ui = new DeskUI(window.game, {
      onActionChosen: (action) => {
        console.log('[Action Chosen]:', action);
        if (action.type === 'wheel') {
          window.diorama.spawnWheel(action.zone);
        } else if (action.type === 'shuttle') {
          window.diorama.buildShuttle(action.zone, action.to_zone);
        } else if (action.type === 'market') {
          window.diorama.buildMarket(action.zone);
        } else if (action.type === 'event') {
          window.diorama.spawnInflatableCupid(action.zone);
        } else if (action.type === 'hearing') {
          window.diorama.triggerVfx('HEARING_HYPNOSIS_ZZZ');
        }

        // Check Deficit & Complaints audio states
        window.audio.setDeficitState(window.game.net_budget < 0);
        window.audio.setComplaintsFilter(window.game.complaints >= 50);
        if (window.game.net_budget < 0) {
          window.diorama.applyCourtSeizure();
        }
      },
      onSceneReset: () => {
        window.diorama.reset();
      },
      onBudgetReset: (newBudget) => {
        console.log('[Budget Reset]:', newBudget);
        window.audio.setDeficitState(window.game.net_budget < 0);
        window.audio.setComplaintsFilter(window.game.complaints >= 50);
      },
      onDocumentOpen: () => {
        console.log('[Document Opened]');
        window.audio.duckAudio();
      },
      onStampSlam: () => {
        console.log('[Stamp Slammed]');
        window.audio.slamStampAndRebound();
      },
      onVfxCallback: (vfx) => {
        console.log('[VFX Triggered]:', vfx);
        window.diorama.triggerVfx(vfx);
        if (vfx === 'MEGAPHONE_BLAST') {
          window.audio.playMegaphoneFeedback();
        }
      },
      onGameFinished: (endingKey, snapshot) => {
        console.log('[Game Finished]:', endingKey, snapshot);
        window.dossier.showEnding(endingKey, snapshot, window.diorama.canvas);
      }
    });
  </script>
</body>
</html>
